    <!-- Register PWA Service Worker for Mobile & Play Store Instant OTA Updates -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              // Check for app updates every time the app opens
              reg.update();
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('FestVault updated in background. Ready for seamless reload.');
                    }
                  });
                }
              });
            })
            .catch((err) => console.log('Service Worker reg error:', err));
        });
      }
    </script>
